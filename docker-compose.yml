# Magnetico — identity, portal database and remote-access gateway.
#
#   cp .env.example .env    # fill in the Google OAuth client + secrets
#   docker compose up -d
#
# Host ports: 5432 portal-db · 8180 Keycloak (http://localhost:8180/auth)
#             127.0.0.1:8085 Guacamole admin dashboard (loopback only)
# nginx and the billing daemon join this file later.

name: magnetico

services:
  # Portal database — the only DB the backend (Prisma) touches.
  portal-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: ${PORTAL_DB_USER:-magnetico}
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-magnetico}
    ports:
      - "5432:5432"
    volumes:
      - portal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Keycloak's own database, isolated from the Portal DB. Not published.
  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Identity: realm "magnetico", brokering Google. Served under /auth so the
  # later nginx rule (/auth/* -> keycloak) needs no path rewriting.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    # Turns ADMIN_EMAILS ("a@x.com, b@y.com") into the anchored regex the
    # realm's admin-by-email mapper matches Google's `email` claim against.
    # "." and "+" become [.] / [+] so john.smith@ can't be matched by
    # johnXsmith@. Empty list -> a pattern no real email can match.
    entrypoint:
      - /bin/bash
      - -c
      - |
        e="$${ADMIN_EMAILS,,}"; e="$${e// /}"; e="$${e//./[.]}"; e="$${e//+/[+]}"; e="$${e//,/|}"
        export ADMIN_EMAILS_REGEX="^($${e:-no-admin-configured})$$"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Substituted into keycloak/magnetico-realm.json at import time.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in infra/.env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in infra/.env}
      PORTAL_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET:?set PORTAL_CLIENT_SECRET in infra/.env}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/magnetico-realm.json:/opt/keycloak/data/import/magnetico-realm.json:ro

  # ---- Remote access ------------------------------------------------------
  # guacd speaks SSH/RDP to the real servers. It is the only container that
  # needs to reach them, and it sits on its own network: no route to the
  # portal database or Keycloak.
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    environment:
      GUACD_LOG_LEVEL: info
    # Lets a server running on this Docker host be added as
    # "host.docker.internal" (Docker Desktop has it; Linux needs this line).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Session recordings (servers with "Record sessions" on) land here, one
    # folder per session. Shared with Guacamole (replay in its History) and
    # read by the backend on the host (replay in Admin → Sessions).
    volumes:
      - ./recordings:/var/lib/guacamole/recordings
    networks: [remote-access]

  # Guacamole's own database: connections (synced from the portal's Admin →
  # Servers), per-user accounts, active sessions and history. Initialised once
  # from guacamole-db/ (official schema + your admin + the backend's service
  # account). It stores connection passwords — never publish it.
  guac-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD:?set GUAC_DB_PASSWORD in infra/.env}
      GUAC_ADMIN_USER: ${GUAC_ADMIN_USER:-guacadmin}
      GUAC_ADMIN_PASSWORD: ${GUAC_ADMIN_PASSWORD:?set GUAC_ADMIN_PASSWORD in infra/.env}
      GUAC_SERVICE_USER: ${GUAC_SERVICE_USER:-magnetico-portal}
      GUAC_SERVICE_PASSWORD: ${GUAC_SERVICE_PASSWORD:?set GUAC_SERVICE_PASSWORD in infra/.env}
    volumes:
      - guac-db-data:/var/lib/postgresql/data
      - ./guacamole-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole -d guacamole_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [remote-access]

  # Guacamole with its database: servers added in the portal appear here as
  # connections (group "Magnetico"), with live sessions and history per user.
  # Admin dashboard: http://localhost:8085/guacamole (GUAC_ADMIN_USER).
  # Users never come here — the portal proxies their sessions.
  # Loopback only: the dashboard and API must not be reachable from the LAN.
  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on:
      guacd:
        condition: service_started
      guac-db:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      POSTGRESQL_HOSTNAME: guac-db
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD:?set GUAC_DB_PASSWORD in infra/.env}
      # Enables guacamole-history-recording-storage: recordings become
      # playable from Guacamole's History screen.
      RECORDING_SEARCH_PATH: /var/lib/guacamole/recordings
    volumes:
      - ./recordings:/var/lib/guacamole/recordings:ro
    ports:
      - "127.0.0.1:8085:8080"
    networks: [remote-access]

volumes:
  portal-db-data:
  keycloak-db-data:
  guac-db-data:

networks:
  remote-access:
