# Magnetico infra — ONE compose file for the whole platform (Keycloak,
# Guacamole, backend, daemon; the Next.js frontend runs separately on :3000).
#
# THREE isolated Postgres databases (separate volumes, never shared):
#   portal-db   : Prisma / portal-backend (+ billing-daemon reads).
#                 Schema in backend/prisma/.
#   guac-db     : Apache Guacamole's own DB (official initdb.sql on 1st boot).
#                 Portal code NEVER connects here (REST API only).
#   keycloak-db : Keycloak's own DB. Nothing else touches it.
#
# Secrets live in infra/.env (auto-loaded, gitignored).
#
# Usage:
#   docker compose up -d --build     # everything
#   docker compose up -d portal-db guac-db guacd guacamole   # data plane only

name: magnetico

services:
  portal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PORTAL_DB_USER:-magnetico}
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-magnetico}
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - portal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  guac-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: guacamole
      POSTGRES_DB: guacamole
    # NOTE: no host port published on purpose — only the guacamole container
    # should reach this DB. Publish 5433:5432 temporarily if you need psql.
    volumes:
      # First boot only: official Guacamole schema, loaded once into a fresh
      # volume (see guacamole-init/README). Afterwards this mount is unused.
      - ./guacamole-init:/docker-entrypoint-initdb.d:ro
      - guac-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole -d guacamole"]
      interval: 5s
      timeout: 3s
      retries: 10

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    # No published ports — only guacamole talks to guacd (port 4822).

  # Keycloak's own database, isolated from the Portal DB. Not published.
  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Identity: realm "magnetico", brokering Google. Served under /auth so the
  # nginx rule (/auth/* -> keycloak) needs no path rewriting.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    # Turns ADMIN_EMAILS ("a@x.com, b@y.com") into the anchored regex the
    # realm's admin-by-email mapper matches Google's `email` claim against.
    # "." and "+" become [.] / [+] so john.smith@ can't be matched by
    # johnXsmith@. Empty list -> a pattern no real email can match.
    entrypoint:
      - /bin/bash
      - -c
      - |
        e="$${ADMIN_EMAILS,,}"; e="$${e// /}"; e="$${e//./[.]}"; e="$${e//+/[+]}"; e="$${e//,/|}"
        export ADMIN_EMAILS_REGEX="^($${e:-no-admin-configured})$$"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Substituted into keycloak/keycloak/magnetico-realm.json at import time.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in infra/.env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in infra/.env}
      PORTAL_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET:?set PORTAL_CLIENT_SECRET in infra/.env}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/keycloak/magnetico-realm.json:/opt/keycloak/data/import/magnetico-realm.json:ro

  guacamole:
    image: guacamole/guacamole:1.5.5
    restart: unless-stopped
    depends_on:
      guac-db:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      POSTGRES_HOSTNAME: guac-db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: guacamole
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: guacamole
      # TODO(secrets, step 14): move these into a managed secret store.
      GUACAMOLE_ADMIN_USER: guacadmin
      GUACAMOLE_ADMIN_PASSWORD: guacadmin
      # Step 7: shared 128-bit key (32 hex digits) enabling the bundled
      # guacamole-auth-json extension. MUST equal the backend's
      # GUAC_JSON_AUTH_SECRET. Unset/empty = JSON auth stays disabled
      # (JDBC login only) — same as before step 7.
      JSON_SECRET_KEY: ${GUAC_JSON_AUTH_SECRET:-}
    ports:
      - "8085:8080"

  portal-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      portal-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PORTAL_DB_USER:-magnetico}:${PORTAL_DB_PASSWORD:-magnetico}@portal-db:5432/portal?schema=public
      PORT: "4000"
      STUB_USER_ID: ${STUB_USER_ID:-00000000-0000-0000-0000-000000000001}
      STUB_KEYCLOAK_SUB: ${STUB_KEYCLOAK_SUB:-stub-sub-dev-only}
      STUB_EMAIL: ${STUB_EMAIL:-dev@magnetico.local}
      STUB_DISPLAY_NAME: ${STUB_DISPLAY_NAME:-Dev User}
      GUAC_BASE_URL: ${GUAC_BASE_URL:-http://localhost:8085/guacamole}
      HOLD_MINUTES_DEFAULT: ${HOLD_MINUTES_DEFAULT:-60}
      # Step 7: real JSON-auth tokens need the same 128-bit key as Guacamole's
      # JSON_SECRET_KEY above (32 hex digits). Unset = dev stub tokens.
      GUAC_JSON_AUTH_SECRET: ${GUAC_JSON_AUTH_SECRET:-}
      # Step 7: per-connection parameters keyed by guac_connection_id.
      # Hostnames must resolve INSIDE the compose network.
      GUAC_CONNECTION_PARAMS: ${GUAC_CONNECTION_PARAMS:-{}}
      # Step 11: Keycloak JWT verification. ISSUER must equal the token `iss`
      # claim (browser-facing URL); the JWKS document is fetched server-side,
      # where Keycloak answers as `keycloak:8080` on this network.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/auth/realms/magnetico}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/auth/realms/magnetico/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-magnetico-portal}
      # Step 7b: Guacamole admin login used to provision per-session JDBC
      # users (the daemon meters those; pure JSON-auth tunnels are invisible
      # to every Guacamole observability surface).
      GUAC_ADMIN_USER: ${GUAC_ADMIN_USER:-guacadmin}
      GUAC_ADMIN_PASSWORD: ${GUAC_ADMIN_PASSWORD:-guacadmin}
    ports:
      - "4000:4000"

  # Step 9: metering loop — Guacamole activity in, holds/charges/refunds out.
  billing-daemon:
    build:
      context: ../billing-daemon
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      portal-db:
        condition: service_healthy
      guacamole:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${PORTAL_DB_USER:-magnetico}:${PORTAL_DB_PASSWORD:-magnetico}@portal-db:5432/portal?schema=public
      GUAC_BASE_URL: http://guacamole:8080/guacamole
      GUAC_ADMIN_USER: ${GUAC_ADMIN_USER:-guacadmin}
      GUAC_ADMIN_PASSWORD: ${GUAC_ADMIN_PASSWORD:-guacadmin}
      GUAC_DATA_SOURCES: ${GUAC_DATA_SOURCES:-postgresql,json}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-30000}
      TOKEN_GRACE_MS: ${TOKEN_GRACE_MS:-120000}

  # Demo SSH target for the metered Connect flow. No published ports — only
  # Guacamole reaches it (hostname `sshd` inside this network). Credentials
  # come from infra/.env and are dev-only (TODO(secrets, step 14)).
  sshd:
    image: linuxserver/openssh-server:10.3_p1-r1-ls237
    restart: unless-stopped
    environment:
      USER_NAME: ${SSH_USER:-ops}
      USER_PASSWORD: ${SSH_PASSWORD:?Set SSH_PASSWORD in infra/.env}
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
    volumes:
      - sshd-config:/config

  # Step 12: single entrypoint for the whole platform. Host port 8000
  # (:80 is taken by System, :8080 by Jenkins on dev machines).
  # Frontend runs outside compose (prompt spec) on host :3000.
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - portal-backend
      - guacamole
      - keycloak
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  portal-db-data:
  guac-db-data:
  keycloak-db-data:
  sshd-config:
