# Magnetico — single entrypoint (prompt.md step 12).
#
#   /auth/*      -> keycloak:8080        (Keycloak serves /auth natively,
#                                         no rewrite needed)
#   /api/*       -> portal-backend:4000  (portal REST + Swagger /docs)
#   /guacamole/* -> guacamole:8080       (webapp + tunnel websockets)
#   /*           -> host frontend :3000  (Next.js dev, runs outside compose)
#
# NOTES
# - OIDC logins keep working through this proxy once the nginx origin is
#   registered in the Keycloak client (redirectUris + webOrigins); direct
#   :3000/:8180 access keeps working unchanged.
# - Plain HTTP only. Production TLS terminates here (step 14 hardening).

upstream keycloak {
    server keycloak:8080;
}

upstream portal_backend {
    server portal-backend:4000;
}

upstream guacamole {
    server guacamole:8080;
}

# Host frontend (Next dev). Resolved via host-gateway, see extra_hosts.
upstream portal_frontend {
    server host.docker.internal:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # --- Keycloak (identity) -------------------------------------------
    location = /auth {
        return 301 /auth/;
    }
    location /auth/ {
        proxy_pass http://keycloak/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Portal REST API ------------------------------------------------
    location = /api {
        return 301 /api/;
    }
    location /api/ {
        proxy_pass http://portal_backend/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Guacamole (webapp + live tunnels) -------------------------------
    # WebSocket upgrade + long read timeout: tunnels are long-lived
    # bidirectional streams, not request/response calls.
    location = /guacamole {
        return 301 /guacamole/;
    }
    location /guacamole/ {
        proxy_pass http://guacamole/guacamole/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Frontend (catch-all, must stay last) -----------------------------
    location / {
        proxy_pass http://portal_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
